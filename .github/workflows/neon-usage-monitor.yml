name: Monitoring consommation Neon

on:
  schedule:
    # Toutes les heures, à la 7e minute (décalé pour éviter les pics de charge
    # GitHub Actions au sommet de l'heure exacte).
    - cron: "7 * * * *"
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r monitoring/requirements.txt

      - name: Collecter la consommation Neon et vérifier le seuil
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_ORG_ID: ${{ secrets.NEON_ORG_ID }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          ALERT_THRESHOLD_USD: ${{ secrets.ALERT_THRESHOLD_USD }}
          ALERT_RECIPIENT_EMAIL: ${{ secrets.ALERT_RECIPIENT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python monitoring/collect_neon_usage.py
